<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>妞妞記帳 & 周邊圖鑑</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    /* iOS 滾動優化與隱藏捲軸 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    /* 卡片微動畫 */
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up {
      animation: fadeSlideUp 0.25s ease-out forwards;
    }
  </style>
</head>
<body class="bg-rose-50/40 text-slate-800 min-h-screen pb-24 antialiased selection:bg-rose-200">

  <!-- 頂部浮動 Toast 提示訊息 (取代 alert) -->
  <div id="toast-container" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 pointer-events-none transition-all duration-300 opacity-0 -translate-y-2">
    <div id="toast-box" class="bg-slate-800/95 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg flex items-center gap-2 backdrop-blur-md">
      <i id="toast-icon" class="fa-solid fa-circle-check text-rose-400"></i>
      <span id="toast-message">操作成功</span>
    </div>
  </div>

  <!-- 頂部導覽列 -->
  <header class="sticky top-0 z-30 bg-white/85 backdrop-blur-md border-b border-rose-100 px-4 py-3 shadow-2xs">
    <div class="max-w-md mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center space-x-2 min-w-0">
        <span class="text-2xl shrink-0">🍰</span>
        <div class="truncate">
          <h1 class="text-sm sm:text-base font-bold text-slate-800 leading-none truncate">妞妞記帳 & 周邊圖鑑</h1>
          <p class="text-[11px] text-rose-400 font-medium mt-1 truncate" id="today-text"></p>
        </div>
      </div>

      <!-- 動態右側功能按鈕區 (依目前分頁切換) -->
      <div id="header-actions-accounting" class="flex items-center space-x-1.5 shrink-0">
        <button id="btn-export-csv" type="button" class="text-xs bg-rose-50 hover:bg-rose-100 active:scale-95 text-rose-600 px-2.5 py-1.5 rounded-xl border border-rose-200 font-semibold transition flex items-center gap-1 cursor-pointer">
          <i class="fa-solid fa-file-export"></i> 匯出 CSV
        </button>
      </div>

      <div id="header-actions-collection" class="hidden items-center space-x-1.5 shrink-0">
        <button id="btn-backup-menu" type="button" title="備份或還原圖鑑" class="text-xs bg-slate-50 hover:bg-slate-100 active:scale-95 text-slate-600 px-2.5 py-1.5 rounded-xl border border-slate-200 font-medium transition flex items-center gap-1 cursor-pointer">
          <i class="fa-solid fa-cloud-arrow-down text-rose-400"></i> 備份
        </button>
        <button id="btn-open-add-merch" type="button" class="text-xs bg-rose-500 hover:bg-rose-600 active:scale-95 text-white px-3 py-1.5 rounded-xl shadow-xs shadow-rose-200 font-bold transition flex items-center gap-1 cursor-pointer">
          <i class="fa-solid fa-plus"></i> 新增收藏
        </button>
      </div>
    </div>
  </header>

  <!-- ==================== 分頁 1：日常記帳 ==================== -->
  <main id="view-accounting" class="max-w-md mx-auto px-4 pt-3 space-y-4">

    <!-- 信用卡結帳日倒數滑動卡片 -->
    <section>
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-xs font-semibold tracking-wider text-slate-500 uppercase flex items-center gap-1.5">
          <i class="fa-regular fa-credit-card text-rose-400"></i> 各卡結帳日倒數
        </h2>
        <span class="text-[11px] text-slate-400">左右滑動查看</span>
      </div>
      <div id="billing-cards" class="flex gap-2.5 overflow-x-auto no-scrollbar py-1">
        <!-- JS 自動生成各卡結帳日狀態 -->
      </div>
    </section>

    <!-- 記帳輸入卡片主體 -->
    <section class="bg-white rounded-2xl p-4 shadow-xs border border-rose-100 space-y-4">

      <!-- 交易日期與幣別 -->
      <div class="grid grid-cols-5 gap-2">
        <div class="col-span-3">
          <label class="block text-xs font-medium text-slate-500 mb-1">交易日期</label>
          <input type="date" id="input-date" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-700 font-medium focus:outline-none focus:border-rose-400 focus:bg-white transition" />
        </div>
        <div class="col-span-2">
          <label class="block text-xs font-medium text-slate-500 mb-1">幣別</label>
          <select id="input-currency" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 text-sm text-slate-700 font-semibold focus:outline-none focus:border-rose-400 focus:bg-white transition">
            <option value="TWD" selected>TWD (台幣)</option>
            <option value="KRW">KRW (韓元)</option>
            <option value="JPY">JPY (日圓)</option>
            <option value="USD">USD (美金)</option>
            <option value="EUR">EUR (歐元)</option>
            <option value="CNY">CNY (人民幣)</option>
            <option value="HKD">HKD (港幣)</option>
            <option value="GBP">GBP (英鎊)</option>
          </select>
        </div>
      </div>

      <!-- 總金額輸入 -->
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">支出金額</label>
        <div class="relative flex items-center">
          <span id="currency-symbol" class="absolute left-3.5 text-xl font-bold text-slate-400 font-mono">NT$</span>
          <input type="number" id="input-amount" placeholder="0" step="any" inputmode="decimal" class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-14 pr-4 py-2.5 text-2xl font-bold text-slate-800 placeholder-slate-300 focus:outline-none focus:border-rose-400 focus:bg-white transition" />
        </div>
      </div>

      <!-- 類別標籤快速切換 -->
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1.5">支出類別</label>
        <div id="category-grid" class="grid grid-cols-4 gap-1.5 text-xs font-medium">
          <!-- JS 產出類別按鈕 -->
        </div>
      </div>

      <!-- 付款方式分頁選擇器 -->
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">付款方式</label>

        <!-- 子分頁：信用卡 / 轉帳與支付 / 現金點數 -->
        <div class="flex bg-slate-100 p-0.5 rounded-lg text-xs font-medium mb-2" id="pay-type-tabs">
          <button type="button" data-type="credit" class="flex-1 py-1 rounded-md text-slate-800 bg-white shadow-2xs font-semibold cursor-pointer">信用卡</button>
          <button type="button" data-type="transfer" class="flex-1 py-1 rounded-md text-slate-500 hover:text-slate-800 cursor-pointer">轉帳/支付</button>
          <button type="button" data-type="cash" class="flex-1 py-1 rounded-md text-slate-500 hover:text-slate-800 cursor-pointer">現金/點數</button>
        </div>

        <!-- 付款方式下拉清單 -->
        <select id="input-payment" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-700 font-medium focus:outline-none focus:border-rose-400 focus:bg-white transition">
          <!-- JS 動態填入選項 -->
        </select>

        <!-- 帳單週期智慧推算提示 -->
        <div id="billing-cycle-hint" class="hidden mt-1.5 px-3 py-1.5 bg-amber-50 border border-amber-200/60 rounded-lg text-[11px] text-amber-700 flex items-center gap-1.5">
          <i class="fa-solid fa-calendar-check text-amber-500"></i>
          <span id="billing-cycle-text"></span>
        </div>
      </div>

      <!-- 拆帳區塊折疊切換 -->
      <div class="border-t border-slate-100 pt-3">
        <div class="flex items-center justify-between">
          <span class="text-xs font-semibold text-slate-700">是否拆帳</span>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="split-toggle" class="sr-only peer">
            <div class="w-9 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-rose-400"></div>
          </label>
        </div>

        <!-- 拆帳細節設定 (預設收合) -->
        <div id="split-detail" class="hidden mt-3 space-y-2.5 bg-rose-50/50 p-3 rounded-xl border border-rose-100">
          <div>
            <label class="block text-[11px] font-medium text-slate-500 mb-1">費用是誰出？</label>
            <div class="grid grid-cols-3 gap-1.5 text-xs font-medium" id="payer-buttons">
              <button type="button" data-payer="妞凱一起" class="py-1.5 rounded-lg border border-rose-300 bg-rose-400 text-white font-semibold shadow-2xs cursor-pointer">妞凱一起 (5:5)</button>
              <button type="button" data-payer="妞" class="py-1.5 rounded-lg border border-slate-200 bg-white text-slate-600 cursor-pointer">妞妞自付</button>
              <button type="button" data-payer="凱" class="py-1.5 rounded-lg border border-slate-200 bg-white text-slate-600 cursor-pointer">凱出</button>
            </div>
          </div>

          <div>
            <label class="block text-[11px] font-medium text-slate-500 mb-1">妞妞應付金額 (自動試算)</label>
            <div class="relative">
              <input type="number" id="split-actual-amount" step="any" placeholder="0" class="w-full bg-white border border-rose-200 rounded-lg px-3 py-1.5 text-sm font-bold text-rose-600 focus:outline-none focus:border-rose-400" />
            </div>
          </div>
        </div>
      </div>

      <!-- 備註與詳細資料 -->
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">備註 / 說明</label>
        <input type="text" id="input-note" placeholder="例如：好市多牛肉、星巴克拿鐵" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-700 placeholder-slate-400 focus:outline-none focus:border-rose-400 focus:bg-white transition" />
      </div>

      <!-- 送出記帳按鈕 -->
      <button type="button" id="btn-submit" class="w-full bg-rose-500 hover:bg-rose-600 active:scale-[0.99] text-white py-3 rounded-xl font-bold shadow-md shadow-rose-200 transition text-sm flex items-center justify-center gap-2 cursor-pointer">
        <i class="fa-solid fa-plus"></i> 新增這筆記帳
      </button>

    </section>

    <!-- 近期記帳紀錄 -->
    <section class="space-y-2">
      <div class="flex items-center justify-between">
        <h2 class="text-xs font-semibold tracking-wider text-slate-500 uppercase flex items-center gap-1.5">
          <i class="fa-solid fa-receipt text-rose-400"></i> 近期紀錄 (<span id="record-count">0</span>)
        </h2>
        <button id="btn-clear-all" type="button" class="text-[11px] text-slate-400 hover:text-rose-500 transition cursor-pointer">清空資料</button>
      </div>

      <div id="records-list" class="space-y-2">
        <!-- 動態填入近期交易項目 -->
      </div>
    </section>

  </main>

  <!-- ==================== 分頁 2：周邊圖鑑 ==================== -->
  <main id="view-collection" class="hidden max-w-md mx-auto px-4 pt-3 space-y-4">

    <!-- 頂部統計儀表板 -->
    <section class="grid grid-cols-2 gap-2.5">
      <!-- 總收藏件數 -->
      <div class="bg-white rounded-2xl p-3.5 border border-rose-100 shadow-2xs flex flex-col justify-between">
        <div class="flex items-center justify-between text-slate-400 text-[11px] font-medium">
          <span>總收藏件數</span>
          <span class="w-6 h-6 rounded-lg bg-rose-50 text-rose-500 flex items-center justify-center">
            <i class="fa-solid fa-layer-group text-xs"></i>
          </span>
        </div>
        <div class="mt-1.5 flex items-baseline gap-1">
          <span id="stat-total-qty" class="text-2xl font-extrabold text-slate-800">0</span>
          <span class="text-xs text-slate-400">件 (<span id="stat-unique-count">0</span>款)</span>
        </div>
      </div>

      <!-- 累計花費明細 (支援多幣別分列) -->
      <div class="bg-white rounded-2xl p-3.5 border border-rose-100 shadow-2xs flex flex-col justify-between">
        <div class="flex items-center justify-between text-slate-400 text-[11px] font-medium">
          <span>圖鑑累計花費</span>
          <span class="w-6 h-6 rounded-lg bg-amber-50 text-amber-500 flex items-center justify-center">
            <i class="fa-solid fa-coins text-xs"></i>
          </span>
        </div>
        <div id="stat-total-spent" class="mt-1.5 text-sm font-extrabold text-rose-600 leading-tight break-all">
          NT$ 0
        </div>
      </div>

      <!-- 偶像周邊數量 -->
      <div id="card-filter-idol" class="bg-gradient-to-br from-pink-50 to-rose-50/70 rounded-2xl p-3 border border-pink-100/80 flex items-center justify-between cursor-pointer active:scale-[0.98] transition">
        <div>
          <span class="text-[11px] font-semibold text-pink-600 block">🎤 偶像周邊</span>
          <span class="text-lg font-extrabold text-slate-800"><span id="stat-idol-qty">0</span> <span class="text-xs font-normal text-slate-500">件</span></span>
        </div>
        <i class="fa-solid fa-heart text-pink-300 text-xl"></i>
      </div>

      <!-- 二次元動漫數量 -->
      <div id="card-filter-anime" class="bg-gradient-to-br from-sky-50 to-indigo-50/60 rounded-2xl p-3 border border-sky-100/80 flex items-center justify-between cursor-pointer active:scale-[0.98] transition">
        <div>
          <span class="text-[11px] font-semibold text-sky-600 block">✨ 二次元動漫</span>
          <span class="text-lg font-extrabold text-slate-800"><span id="stat-anime-qty">0</span> <span class="text-xs font-normal text-slate-500">件</span></span>
        </div>
        <i class="fa-solid fa-book-open text-sky-300 text-xl"></i>
      </div>
    </section>

    <!-- 搜尋與多重篩選列 -->
    <section class="bg-white rounded-2xl p-3.5 border border-rose-100 shadow-2xs space-y-3">
      <!-- 搜尋框 -->
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass text-slate-400 text-xs absolute left-3.5 top-1/2 -translate-y-1/2"></i>
        <input type="text" id="merch-search" placeholder="搜尋物品名稱、團體/作品、角色、購買來源..." class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-9 pr-8 py-2 text-xs text-slate-700 placeholder-slate-400 focus:outline-none focus:border-rose-400 focus:bg-white transition" />
        <button id="btn-clear-search" type="button" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-1">
          <i class="fa-solid fa-xmark text-xs"></i>
        </button>
      </div>

      <!-- 圈子切換標籤 -->
      <div class="flex bg-slate-100 p-0.5 rounded-xl text-xs font-medium" id="merch-circle-tabs">
        <button type="button" data-circle="全部" class="flex-1 py-1.5 rounded-lg bg-white text-slate-800 font-bold shadow-2xs transition cursor-pointer">全部</button>
        <button type="button" data-circle="偶像" class="flex-1 py-1.5 rounded-lg text-slate-500 hover:text-slate-800 transition cursor-pointer">🎤 偶像周邊</button>
        <button type="button" data-circle="二次元動漫" class="flex-1 py-1.5 rounded-lg text-slate-500 hover:text-slate-800 transition cursor-pointer">✨ 二次元動漫</button>
      </div>

      <!-- 類別橫向滑動篩選標籤 -->
      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-0.5" id="merch-category-pills">
        <!-- JS 自動生成 -->
      </div>
    </section>

    <!-- 圖鑑雙欄卡片網格 (2-column Grid) -->
    <section>
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-xs font-semibold tracking-wider text-slate-500 uppercase flex items-center gap-1.5">
          <i class="fa-solid fa-sparkles text-rose-400"></i> 收藏清單 (<span id="merch-filtered-count">0</span>)
        </h2>
        <select id="merch-sort" class="text-[11px] text-slate-500 bg-transparent border-none focus:outline-none cursor-pointer font-medium">
          <option value="newest">最新購買日期</option>
          <option value="priceDesc">金額：高 → 低</option>
          <option value="priceAsc">金額：低 → 高</option>
        </select>
      </div>

      <div id="merch-grid" class="grid grid-cols-2 gap-3">
        <!-- JS 動態生成周邊卡片 -->
      </div>
    </section>

  </main>

  <!-- ==================== 底部固定雙分頁切換列 ==================== -->
  <nav class="fixed bottom-0 inset-x-0 z-30 bg-white/95 backdrop-blur-md border-t border-rose-100 shadow-[0_-4px_16px_rgba(244,63,94,0.06)]">
    <div class="max-w-md mx-auto grid grid-cols-2 h-16 px-2">
      <button type="button" id="nav-tab-accounting" class="flex flex-col items-center justify-center gap-1 text-rose-500 font-bold transition cursor-pointer">
        <div class="w-10 h-7 rounded-full bg-rose-100/80 flex items-center justify-center transition-all" id="nav-pill-accounting">
          <i class="fa-solid fa-wallet text-sm"></i>
        </div>
        <span class="text-[11px]">日常記帳</span>
      </button>

      <button type="button" id="nav-tab-collection" class="flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-600 font-medium transition cursor-pointer">
        <div class="w-10 h-7 rounded-full bg-transparent flex items-center justify-center transition-all" id="nav-pill-collection">
          <i class="fa-solid fa-images text-sm"></i>
        </div>
        <span class="text-[11px]">周邊圖鑑</span>
      </button>
    </div>
  </nav>

  <!-- ==================== 彈窗 1：新增 / 編輯周邊收藏 ==================== -->
  <div id="modal-merch-form" class="hidden fixed inset-0 z-40 bg-slate-900/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4 overflow-y-auto">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl border border-rose-100 shadow-2xl overflow-hidden max-h-[92vh] flex flex-col animate-fade-up">

      <!-- 彈窗標題列 -->
      <div class="px-5 py-3.5 border-b border-rose-100 flex items-center justify-between bg-rose-50/40 shrink-0">
        <h3 id="modal-merch-title" class="text-sm font-bold text-slate-800 flex items-center gap-2">
          <span class="text-base">🎀</span> 新增周邊收藏
        </h3>
        <button type="button" id="btn-close-merch-modal" class="w-8 h-8 rounded-full bg-white text-slate-400 hover:text-slate-600 flex items-center justify-center shadow-2xs cursor-pointer">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- 可捲動表單區 -->
      <form id="merch-form" class="p-4 space-y-3.5 overflow-y-auto flex-1">
        <input type="hidden" id="merch-id" />

        <!-- 圖片上傳與即時預覽 -->
        <div class="flex items-center gap-3.5 bg-slate-50 p-3 rounded-2xl border border-dashed border-rose-200">
          <div id="merch-image-preview-box" class="w-20 h-24 rounded-xl bg-white border border-rose-100 flex flex-col items-center justify-center overflow-hidden shrink-0 relative cursor-pointer shadow-2xs">
            <img id="merch-image-preview" src="" alt="預覽" class="hidden w-full h-full object-cover" />
            <div id="merch-image-placeholder" class="text-center p-1 text-rose-300">
              <i class="fa-solid fa-camera text-xl mb-1 block"></i>
              <span class="text-[10px] font-medium block leading-tight">拍照/選圖</span>
            </div>
            <div id="merch-compressing-mask" class="hidden absolute inset-0 bg-slate-900/60 text-white text-[10px] font-bold flex items-center justify-center text-center px-1">
              壓縮處理中...
            </div>
          </div>

          <div class="flex-1 space-y-1.5">
            <div class="flex gap-1.5">
              <button type="button" id="btn-trigger-upload" class="px-3 py-1.5 rounded-xl bg-rose-500 hover:bg-rose-600 text-white text-xs font-semibold shadow-2xs flex items-center gap-1.5 cursor-pointer">
                <i class="fa-solid fa-image"></i> 上傳照片
              </button>
              <button type="button" id="btn-remove-image" class="hidden px-2.5 py-1.5 rounded-xl bg-white border border-slate-200 text-slate-500 hover:text-rose-500 text-xs cursor-pointer">
                清除
              </button>
            </div>
            <p class="text-[11px] text-slate-400 leading-relaxed">
              支援手機直接拍照或從相簿選圖，系統會自動最佳化壓縮不佔空間。
            </p>
            <input type="file" id="merch-file-input" accept="image/*" class="hidden" />
          </div>
        </div>

        <!-- 所屬圈子選擇 -->
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">所屬圈子</label>
          <div class="grid grid-cols-2 gap-2" id="form-circle-btns">

      toastTimer = setTimeout(() => {
        container.classList.remove('opacity-100', 'translate-y-0');
        container.classList.add('opacity-0', '-translate-y-2');
      }, 2800);

    function renderBillingCards() {
      const container = document.getElementById('billing-cards');
      container.innerHTML = '';
      const now = new Date();
      const todayDay = now.getDate();

      const banks = [
        { name: '上海', day: 2, cards: '簡單卡 / 小小兵' },
        { name: '國泰', day: 7, cards: 'CUBE 卡' },
        { name: '富邦', day: 22, cards: 'J卡/MOMO/Costco' },
        { name: '台新', day: 23, cards: 'Richart 卡' },
        { name: '玉山', day: 25, cards: '南山 / U BEAR' },
        { name: '永豐', day: 26, cards: 'Sport / 大戶' },
        { name: '中信', day: 27, cards: 'LalaPort/Unipon' }
      ];

      banks.forEach(b => {
        let diff = b.day - todayDay;
        if (diff < 0) {
          const nextMonthDate = new Date(now.getFullYear(), now.getMonth() + 1, b.day);
          diff = Math.ceil((nextMonthDate - now) / (1000 * 60 * 60 * 24));
        }

        const isUrgent = diff <= 3;
        const cardEl = document.createElement('div');
        cardEl.className = `min-w-[130px] p-2.5 rounded-xl border flex flex-col justify-between shrink-0 shadow-2xs ${
          isUrgent ? 'bg-rose-50/90 border-rose-200 text-rose-900' : 'bg-white border-slate-200/70 text-slate-700'
        }`;

        cardEl.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="font-bold text-xs">${b.name} (${b.day}號)</span>
            <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded ${isUrgent ? 'bg-rose-200 text-rose-700' : 'bg-slate-100 text-slate-500'}">
              ${diff === 0 ? '今日結帳' : `剩 ${diff} 天`}
            </span>
          </div>
          <div class="text-[10px] text-slate-400 mt-1 truncate">${b.cards}</div>
        `;
        container.appendChild(cardEl);
      });
    }

    function populatePaymentOptions(type) {
      const select = document.getElementById('input-payment');
      select.innerHTML = '';

      list.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.name;

        opt.dataset.billing = item.billingDay || '';
        select.appendChild(opt);
      });
      updateBillingCycleHint();

    function updateBillingCycleHint() {
      const select = document.getElementById('input-payment');
      const hintBox = document.getElementById('billing-cycle-hint');
      const hintText = document.getElementById('billing-cycle-text');
      const selectedOption = select.options[select.selectedIndex];
      const billingDay = selectedOption ? selectedOption.dataset.billing : null;
      const dateVal = document.getElementById('input-date').value;

      if (billingDay && dateVal) {
        const transDate = new Date(dateVal);
        const day = transDate.getDate();
        const month = transDate.getMonth() + 1;

        let cycleMonth;
        let cycleYear = transDate.getFullYear();
        if (day <= parseInt(billingDay, 10)) {
          cycleMonth = month;
        } else {
          cycleMonth = month + 1;
          if (cycleMonth > 12) {
            cycleMonth = 1;
            cycleYear += 1;
          }
        }
        hintText.textContent = `每月 ${billingDay} 日結帳：此筆計入 ${cycleYear} 年 ${cycleMonth} 月帳單`;
        hintBox.classList.remove('hidden');
      } else {
        hintBox.classList.add('hidden');
      }
    }

    function calculateSplitAmount() {
      const total = parseFloat(document.getElementById('input-amount').value) || 0;
      const actualInput = document.getElementById('split-actual-amount');
      if (state.payer === '妞凱一起') {
        actualInput.value = (total / 2).toFixed(total % 2 === 0 ? 0 : 1);
      } else if (state.payer === '妞') {
        actualInput.value = total;
      } else {
        actualInput.value = 0;
      }
    }

    function setupAccountingEvents() {
      // 幣別切換
      document.getElementById('input-currency').addEventListener('change', (e) => {
        const cur = e.target.value;
        document.getElementById('currency-symbol').textContent = CURRENCY_SYMBOLS[cur] || cur;
      });

      // 付款方式分頁切換
      const tabBtns = document.querySelectorAll('#pay-type-tabs button');
      tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          tabBtns.forEach(b => {
            b.className = 'flex-1 py-1 rounded-md text-slate-500 hover:text-slate-800 cursor-pointer';

          state.currentPayType = btn.dataset.type;
          populatePaymentOptions(state.currentPayType);
        });
      });

      document.getElementById('input-payment').addEventListener('change', updateBillingCycleHint);
      document.getElementById('input-date').addEventListener('change', updateBillingCycleHint);

      // 拆帳開關切換
      const splitToggle = document.getElementById('split-toggle');
      const splitDetail = document.getElementById('split-detail');
      splitToggle.addEventListener('change', (e) => {
        if (e.target.checked) {
          splitDetail.classList.remove('hidden');
          calculateSplitAmount();
        } else {
          splitDetail.classList.add('hidden');
        }
      });

      // 拆帳付款人選擇
      const payerBtns = document.querySelectorAll('#payer-buttons button');
      payerBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          payerBtns.forEach(b => {
            b.className = 'py-1.5 rounded-lg border border-slate-200 bg-white text-slate-600 cursor-pointer';
          });
          btn.className = 'py-1.5 rounded-lg border border-rose-300 bg-rose-400 text-white font-semibold shadow-2xs cursor-pointer';
          state.payer = btn.dataset.payer;
          calculateSplitAmount();
        });
      });

      // 金額聯動試算
      document.getElementById('input-amount').addEventListener('input', () => {
        if (splitToggle.checked) calculateSplitAmount();
      });

      // 送出記帳
      document.getElementById('btn-submit').addEventListener('click', () => {
        const amount = parseFloat(document.getElementById('input-amount').value);
        if (!amount || amount <= 0) {
          showToast('請輸入有效的支出金額！', 'error');
          return;
        }

        const date = document.getElementById('input-date').value;
        const currency = document.getElementById('input-currency').value;
        const payment = document.getElementById('input-payment').value;
        const isSplit = document.getElementById('split-toggle').checked;
        const actualAmount = isSplit ? parseFloat(document.getElementById('split-actual-amount').value) || 0 : amount;
        const note = document.getElementById('input-note').value.trim();

        const newRecord = {
          id: Date.now(),
          date,
          currency,
          category: state.selectedCategory,
          amount,
          payment,
          isSplit,
          payer: isSplit ? state.payer : '本人',
          actualAmount,
          note
        };

        state.records.unshift(newRecord);
        saveAccountingRecords();

        document.getElementById('input-amount').value = '';
        document.getElementById('input-note').value = '';
        renderRecords();
        showToast('已成功新增這筆記帳！');
      });

      // 清空資料
      document.getElementById('btn-clear-all').addEventListener('click', () => {
        if (state.records.length === 0) return;
        openConfirmModal(
          '確定清空所有記帳資料？',
          '清空後無法復原，建議先點擊右上角「匯出 CSV」備份檔案。',
          () => {
            state.records = [];
            localStorage.removeItem(ACCOUNTING_STORAGE_KEY);
            renderRecords();
            showToast('已清空所有記帳紀錄');
          }
        );
      });

      document.getElementById('btn-export-csv').addEventListener('click', exportCSV);

    function exportCSV() {
      if (state.records.length === 0) {
        showToast('目前沒有記帳紀錄可以匯出！', 'error');
        return;
      }
      let csvContent = '\uFEFF交易日期,幣別,支出類別,總金額,付款方式,是否拆帳,費用誰出,妞實際付款金額,備註\n';
      state.records.forEach(r => {
        const cleanNote = (r.note || '').replace(/"/g, '""');
        csvContent += `"${r.date}","${r.currency}","${r.category}",${r.amount},"${r.payment}","${r.isSplit ? '是' : '否'}","${r.payer}",${r.actualAmount},"${cleanNote}"\n`;
      });
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', `妞妞記帳明細_${getTodayISO()}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      showToast('CSV 記帳明細已匯出！');
    }

    function autoDetectSyncCategory() {

    // 圖片上傳與 Canvas 自動壓縮 (最大寬度 560px, JPEG 0.78 品質)
    function handleMerchImageFile(file) {
      if (!file || !file.type.startsWith('image/')) {
        showToast('請選擇有效的圖片檔案', 'error');
        return;
      }
      const mask = document.getElementById('merch-compressing-mask');
      mask.classList.remove('hidden');

      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 560;
          let w = img.width;
          let h = img.height;
          if (w > MAX_WIDTH) {
            h = Math.round((h * MAX_WIDTH) / w);
            w = MAX_WIDTH;
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);

          const compressed = canvas.toDataURL('image/jpeg', 0.78);
          state.formImageBase64 = compressed;
          setFormImagePreview(compressed);
          mask.classList.add('hidden');
          showToast('照片已自動壓縮並載入！');
        };
        img.onerror = () => {
          mask.classList.add('hidden');
          showToast('圖片讀取失敗，請重試', 'error');
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function setFormImagePreview(src) {
      const preview = document.getElementById('merch-image-preview');
      const placeholder = document.getElementById('merch-image-placeholder');
      const removeBtn = document.getElementById('btn-remove-image');
      if (src) {
        preview.src = src;
        preview.classList.remove('hidden');
        placeholder.classList.add('hidden');
        removeBtn.classList.remove('hidden');
      } else {
        preview.src = '';
        preview.classList.add('hidden');
        placeholder.classList.remove('hidden');
        removeBtn.classList.add('hidden');
      }
    }

    function setFormCircle(circle) {
      state.formCircle = circle;
      const btns = document.querySelectorAll('#form-circle-btns button');
      btns.forEach(b => {
        if (b.dataset.val === circle) {
          b.className = circle === '偶像'
            ? 'py-2 rounded-xl border border-pink-300 bg-pink-500 text-white text-xs font-bold shadow-2xs cursor-pointer'
            : 'py-2 rounded-xl border border-sky-300 bg-sky-500 text-white text-xs font-bold shadow-2xs cursor-pointer';
        } else {
          b.className = 'py-2 rounded-xl border border-slate-200 bg-slate-50 text-slate-600 text-xs font-semibold cursor-pointer';
        }
      });
    }

    // 開啟新增周邊視窗
    function openAddMerchModal() {
      document.getElementById('modal-merch-title').innerHTML = '<span class="text-base">🎀</span> 新增周邊收藏';
      document.getElementById('btn-save-merch-text').textContent = '儲存收藏';
      document.getElementById('merch-id').value = '';
      document.getElementById('merch-name').value = '';
      document.getElementById('merch-category').value = '小卡/拍立得';
      document.getElementById('merch-status').value = '已入手';
      document.getElementById('merch-series').value = '';
      document.getElementById('merch-character').value = '';
      document.getElementById('merch-qty').value = 1;
      document.getElementById('merch-currency').value = 'TWD';
      document.getElementById('merch-price').value = '';
      document.getElementById('merch-date').value = getTodayISO();
      document.getElementById('merch-source').value = '';
      document.getElementById('merch-notes').value = '';

      state.formImageBase64 = '';
      setFormImagePreview('');
      setFormCircle('偶像');

      // 顯示連動記帳開關並預設勾選
      const syncWrap = document.getElementById('sync-accounting-wrapper');
      const syncCheck = document.getElementById('merch-sync-accounting');
      const syncDetails = document.getElementById('sync-accounting-details');
      syncWrap.classList.remove('hidden');
      syncCheck.checked = true;
      syncDetails.classList.remove('hidden');
      autoDetectSyncCategory();
      updateSyncPreviewTotal();

      document.getElementById('modal-merch-form').classList.remove('hidden');
    }

    // 開啟編輯周邊視窗
    function openEditMerchModal(item) {
      document.getElementById('modal-merch-title').innerHTML = '<span class="text-base">✏️</span> 編輯周邊明細';
      document.getElementById('btn-save-merch-text').textContent = '儲存修改';
      document.getElementById('merch-id').value = item.id;
      document.getElementById('merch-name').value = item.name;
      document.getElementById('merch-category').value = item.category;
      document.getElementById('merch-status').value = item.status;
      document.getElementById('merch-series').value = item.series || '';
      document.getElementById('merch-character').value = item.character || '';
      document.getElementById('merch-qty').value = item.quantity || 1;
      document.getElementById('merch-currency').value = item.currency || 'TWD';
      document.getElementById('merch-price').value = item.price || '';
      document.getElementById('merch-date').value = item.date || getTodayISO();
      document.getElementById('merch-source').value = item.source || '';
      document.getElementById('merch-notes').value = item.notes || '';

      state.formImageBase64 = item.image || '';
      setFormImagePreview(item.image || '');
      setFormCircle(item.circle || '偶像');

      // 編輯模式隱藏重複記帳開關，避免重複扣款
      document.getElementById('sync-accounting-wrapper').classList.add('hidden');
      document.getElementById('modal-merch-form').classList.remove('hidden');
    }

    // 開啟大圖詳情檢視
    function openDetailModal(item) {
      state.currentDetailId = item.id;
      const imgSrc = item.image || createDefaultMerchSVG(item.circle, item.series || item.name, item.character || item.category);
      document.getElementById('detail-image').src = imgSrc;

      const statusBadge = document.getElementById('detail-status-badge');
      statusBadge.textContent = item.status;
      if (item.status === '已入手') {
        statusBadge.className = 'absolute top-3 left-3 px-2.5 py-1 rounded-full text-[11px] font-bold shadow-xs bg-emerald-500 text-white';
      } else if (item.status === '運送中') {
        statusBadge.className = 'absolute top-3 left-3 px-2.5 py-1 rounded-full text-[11px] font-bold shadow-xs bg-amber-500 text-white';
      } else {
        statusBadge.className = 'absolute top-3 left-3 px-2.5 py-1 rounded-full text-[11px] font-bold shadow-xs bg-purple-500 text-white';
      }

      const circleTag = document.getElementById('detail-circle-tag');
      circleTag.textContent = item.circle;
      circleTag.className = item.circle === '偶像'
        ? 'text-[10px] font-bold px-2 py-0.5 rounded-md bg-pink-100 text-pink-600'
        : 'text-[10px] font-bold px-2 py-0.5 rounded-md bg-sky-100 text-sky-600';

      document.getElementById('detail-cat-tag').textContent = item.category;
      const seriesChar = [item.series, item.character].filter(Boolean).join(' · ');
      document.getElementById('detail-series-char').textContent = seriesChar;
      document.getElementById('detail-name').textContent = item.name;

      const sym = CURRENCY_SYMBOLS[item.currency] || item.currency;
      const qty = Number(item.quantity) || 1;
      const price = Number(item.price) || 0;
      const total = qty * price;
      document.getElementById('detail-price-qty').textContent = qty > 1
        ? `${sym} ${price.toLocaleString()} × ${qty} = ${sym} ${total.toLocaleString()}`
        : `${sym} ${price.toLocaleString()} (×1)`;

      document.getElementById('detail-source').textContent = item.source || '未填寫';
      document.getElementById('detail-date').textContent = item.date || '未填寫';

      const notesEl = document.getElementById('detail-notes');
      if (item.notes) {
        notesEl.textContent = `📝 ${item.notes}`;
        notesEl.classList.remove('hidden');
      } else {
        notesEl.classList.add('hidden');
      }

      document.getElementById('modal-merch-detail').classList.remove('hidden');
    }

    // 渲染周邊統計儀表板與雙欄卡片網格
    function renderCollections() {
      let totalQty = 0;
      let idolQty = 0;
      let animeQty = 0;
      const spentByCurrency = {};

      state.collections.forEach(item => {
        const qty = Number(item.quantity) || 1;
        const price = Number(item.price) || 0;
        const cur = item.currency || 'TWD';
        totalQty += qty;
        if (item.circle === '偶像') idolQty += qty;
        if (item.circle === '二次元動漫') animeQty += qty;

        spentByCurrency[cur] = (spentByCurrency[cur] || 0) + qty * price;
      });

      document.getElementById('stat-total-qty').textContent = totalQty;
      document.getElementById('stat-unique-count').textContent = state.collections.length;
      document.getElementById('stat-idol-qty').textContent = idolQty;
      document.getElementById('stat-anime-qty').textContent = animeQty;

      // 多幣別金額顯示
      const curEntries = Object.entries(spentByCurrency).filter(([, val]) => val > 0);
      const spentEl = document.getElementById('stat-total-spent');
      if (curEntries.length === 0) {
        spentEl.textContent = 'NT$ 0';
      } else {
        spentEl.innerHTML = curEntries
          .map(([cur, val]) => `${CURRENCY_SYMBOLS[cur] || cur} ${val.toLocaleString()}`)
          .join('<br>');
      }

      // 篩選與排序
      const q = state.merchSearch.trim().toLowerCase();
      const filtered = state.collections
        .filter(item => {
          if (state.merchFilterCircle !== '全部' && item.circle !== state.merchFilterCircle) return false;
          if (state.merchFilterCategory !== '全部' && item.category !== state.merchFilterCategory) return false;
          if (q) {
            const hay = `${item.name} ${item.series || ''} ${item.character || ''} ${item.source || ''} ${item.notes || ''}`.toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        })
        .sort((a, b) => {
          const totalA = (Number(a.price) || 0) * (Number(a.quantity) || 1);
          const totalB = (Number(b.price) || 0) * (Number(b.quantity) || 1);
          if (state.merchSort === 'priceDesc') return totalB - totalA;
          if (state.merchSort === 'priceAsc') return totalA - totalB;
          return new Date(b.date || 0) - new Date(a.date || 0);
        });

      document.getElementById('merch-filtered-count').textContent = filtered.length;
      const grid = document.getElementById('merch-grid');
      grid.innerHTML = '';

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-2 bg-white rounded-2xl border border-dashed border-rose-200 p-8 text-center space-y-2">
            <div class="text-2xl">🧸</div>
            <p class="text-xs font-bold text-slate-600">找不到符合條件的周邊收藏</p>
            <p class="text-[11px] text-slate-400">試試切換分類，或點擊右上角「+ 新增收藏」吧！</p>
          </div>
        `;
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('article');
        card.className = 'bg-white rounded-2xl border border-rose-100/90 shadow-2xs overflow-hidden flex flex-col justify-between cursor-pointer active:scale-[0.98] transition';

        const imgSrc = item.image || createDefaultMerchSVG(item.circle, item.series || item.name, item.character || item.category);
        const sym = CURRENCY_SYMBOLS[item.currency] || item.currency;
        const qty = Number(item.quantity) || 1;
        const total = qty * (Number(item.price) || 0);

        let statusClass = 'bg-emerald-500/90 text-white';
        if (item.status === '運送中') statusClass = 'bg-amber-500/90 text-white';
        if (item.status === '預購待發貨') statusClass = 'bg-purple-500/90 text-white';

        const circleBadge = item.circle === '偶像'
          ? 'bg-pink-50 text-pink-600'
          : 'bg-sky-50 text-sky-600';

        card.innerHTML = `
          <div>
            <div class="relative aspect-[4/4.3] bg-slate-50 overflow-hidden">
              <img src="${imgSrc}" alt="${item.name}" class="w-full h-full object-cover" loading="lazy" />
              <span class="absolute top-2 left-2 px-2 py-0.5 rounded-full text-[10px] font-bold backdrop-blur-xs shadow-2xs ${statusClass}">
                ${item.status}
              </span>
              ${qty > 1 ? `<span class="absolute top-2 right-2 px-1.5 py-0.5 rounded-md bg-slate-900/80 text-white text-[10px] font-extrabold">×${qty}</span>` : ''}
            </div>

            <div class="p-2.5 space-y-1">
              <div class="flex items-center gap-1 flex-wrap">
                <span class="text-[10px] font-bold px-1.5 py-0.2 rounded ${circleBadge}">${item.circle === '偶像' ? '偶像' : '動漫'}</span>
                <span class="text-[10px] text-slate-400 truncate max-w-[85px]">${item.series || item.category}</span>
              </div>
              <h3 class="text-xs font-bold text-slate-800 line-clamp-2 leading-snug">${item.name}</h3>
            </div>
          </div>

          <div class="px-2.5 pb-2.5 pt-1.5 border-t border-slate-50 flex items-end justify-between gap-1">
            <div class="min-w-0">
              <span class="text-xs font-extrabold text-rose-500 block">${sym} ${total.toLocaleString()}</span>
              <span class="text-[10px] text-slate-400 truncate block">${item.source || item.date || ''}</span>
            </div>
            <span class="text-[10px] text-slate-300 shrink-0"><i class="fa-solid fa-chevron-right"></i></span>
          </div>
        `;

        card.onclick = () => openDetailModal(item);
        grid.appendChild(card);
      });
    }

    function setupNavigationAndCollectionEvents() {
      // 底部導覽列切換
      document.getElementById('nav-tab-accounting').addEventListener('click', () => switchMainTab('accounting'));
      document.getElementById('nav-tab-collection').addEventListener('click', () => switchMainTab('collection'));

      // 統計卡片快速篩選
      document.getElementById('card-filter-idol').addEventListener('click', () => {
        setMerchCircleTab(state.merchFilterCircle === '偶像' ? '全部' : '偶像');
      });
      document.getElementById('card-filter-anime').addEventListener('click', () => {
        setMerchCircleTab(state.merchFilterCircle === '二次元動漫' ? '全部' : '二次元動漫');
      });

      // 圈子分頁標籤切換
      function setMerchCircleTab(circle) {
        state.merchFilterCircle = circle;
        const btns = document.querySelectorAll('#merch-circle-tabs button');
        btns.forEach(b => {
          if (b.dataset.circle === circle) {
            b.className = 'flex-1 py-1.5 rounded-lg bg-white text-slate-800 font-bold shadow-2xs transition cursor-pointer';
          } else {
            b.className = 'flex-1 py-1.5 rounded-lg text-slate-500 hover:text-slate-800 transition cursor-pointer';
          }
        });
        renderCollections();
      }

      document.querySelectorAll('#merch-circle-tabs button').forEach(btn => {
        btn.addEventListener('click', () => setMerchCircleTab(btn.dataset.circle));
      });

      // 搜尋框與清除按鈕
      const searchInput = document.getElementById('merch-search');
      const clearSearchBtn = document.getElementById('btn-clear-search');
      searchInput.addEventListener('input', (e) => {
        state.merchSearch = e.target.value;
        if (state.merchSearch) clearSearchBtn.classList.remove('hidden');
        else clearSearchBtn.classList.add('hidden');
        renderCollections();
      });
      clearSearchBtn.addEventListener('click', () => {
        searchInput.value = '';
        state.merchSearch = '';
        clearSearchBtn.classList.add('hidden');
        renderCollections();
      });

      // 排序切換
      document.getElementById('merch-sort').addEventListener('change', (e) => {
        state.merchSort = e.target.value;
        renderCollections();
      });

      // 開啟新增收藏彈窗
      document.getElementById('btn-open-add-merch').addEventListener('click', openAddMerchModal);
      document.getElementById('btn-close-merch-modal').addEventListener('click', () => {
        document.getElementById('modal-merch-form').classList.add('hidden');
      });

      // 圖片上傳與預覽點擊
      const fileInput = document.getElementById('merch-file-input');
      document.getElementById('btn-trigger-upload').addEventListener('click', () => fileInput.click());
      document.getElementById('merch-image-preview-box').addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
          handleMerchImageFile(e.target.files[0]);
        }
        e.target.value = '';
      });

      document.getElementById('btn-remove-image').addEventListener('click', () => {
        state.formImageBase64 = '';
        setFormImagePreview('');
      });

      // 表單所屬圈子按鈕
      document.querySelectorAll('#form-circle-btns button').forEach(btn => {
        btn.addEventListener('click', () => {
          setFormCircle(btn.dataset.val);
          autoDetectSyncCategory();
        });
      });

      // 當輸入名稱、團體/作品、購買來源時，自動智慧切換對應的記帳類別
      ['merch-name', 'merch-series', 'merch-source'].forEach(id => {
        document.getElementById(id).addEventListener('input', autoDetectSyncCategory);
      });

      // 連動記帳開關與即時金額試算
      const syncCheck = document.getElementById('merch-sync-accounting');
      const syncDetails = document.getElementById('sync-accounting-details');
      syncCheck.addEventListener('change', (e) => {
        if (e.target.checked) syncDetails.classList.remove('hidden');
        else syncDetails.classList.add('hidden');
      });

      document.getElementById('sync-pay-type').addEventListener('change', (e) => {
        populateSyncPaymentOptions(e.target.value);
      });

      ['merch-qty', 'merch-price', 'merch-currency'].forEach(id => {
        document.getElementById(id).addEventListener('input', updateSyncPreviewTotal);
        document.getElementById(id).addEventListener('change', updateSyncPreviewTotal);
      });

      // 表單送出儲存（並處理自動連動記帳）
      document.getElementById('merch-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('merch-name').value.trim();
        if (!name) {
          showToast('請輸入物品名稱！', 'error');
          return;
        }

        const editId = document.getElementById('merch-id').value;
        const category = document.getElementById('merch-category').value;
        const status = document.getElementById('merch-status').value;
        const series = document.getElementById('merch-series').value.trim();
        const character = document.getElementById('merch-character').value.trim();
        const quantity = Math.max(1, parseInt(document.getElementById('merch-qty').value, 10) || 1);
        const currency = document.getElementById('merch-currency').value;
        const price = Math.max(0, parseFloat(document.getElementById('merch-price').value) || 0);
        const date = document.getElementById('merch-date').value || getTodayISO();
        const source = document.getElementById('merch-source').value.trim();
        const notes = document.getElementById('merch-notes').value.trim();

        const itemPayload = {
          id: editId || `merch-${Date.now()}`,
          circle: state.formCircle,
          category,
          name,
          series,
          character,
          quantity,
          currency,
          price,
          date,
          source,
          status,
          notes,
          image: state.formImageBase64
        };

        if (editId) {
          state.collections = state.collections.map(it => (it.id === editId ? itemPayload : it));
          if (saveCollections()) {
            document.getElementById('modal-merch-form').classList.add('hidden');
            renderCollections();
            showToast('已更新周邊收藏明細！');
          }
        } else {
          state.collections.unshift(itemPayload);
          if (!saveCollections()) {
            state.collections.shift();
            return;
          }

          // 🔥 檢查是否勾選「同時新增記帳紀錄」
          const shouldSync = document.getElementById('merch-sync-accounting').checked;
          const totalAmount = quantity * price;
          let syncedSuccess = false;

          if (shouldSync && totalAmount > 0) {
            const syncCategory = document.getElementById('sync-category').value;
            const syncPayment = document.getElementById('sync-payment').value;
            const seriesPrefix = series ? `${series} - ` : '';
            const sourceSuffix = source ? ` (${source})` : '';
            const autoNote = `[周邊] ${seriesPrefix}${name}${quantity > 1 ? ` ×${quantity}` : ''}${sourceSuffix}`;

            const accountingRecord = {
              id: Date.now() + 1,
              date,
              currency,
              category: syncCategory,
              amount: totalAmount,
              payment: syncPayment,
              isSplit: false,
              payer: '本人',
              actualAmount: totalAmount,
              note: autoNote,
              fromMerch: true
            };

            state.records.unshift(accountingRecord);
            saveAccountingRecords();
            syncedSuccess = true;
          }

          document.getElementById('modal-merch-form').classList.add('hidden');
          renderCollections();
          renderRecords();

          if (syncedSuccess) {
            showToast('✨ 已存入圖鑑並自動同步至日常記帳！');
          } else {
            showToast('🎀 已成功加入周邊圖鑑！');
          }
        }
      });

      // 大圖詳情彈窗操作
      document.getElementById('btn-close-detail').addEventListener('click', () => {
        document.getElementById('modal-merch-detail').classList.add('hidden');
      });

      document.getElementById('btn-detail-edit').addEventListener('click', () => {
        const target = state.collections.find(it => it.id === state.currentDetailId);
        document.getElementById('modal-merch-detail').classList.add('hidden');
        if (target) openEditMerchModal(target);
      });

      document.getElementById('btn-detail-delete').addEventListener('click', () => {
        const targetId = state.currentDetailId;
        document.getElementById('modal-merch-detail').classList.add('hidden');
        openConfirmModal(
          '確定要刪除這筆周邊收藏嗎？',
          '刪除後此照片與圖鑑明細將會移除（已同步的記帳紀錄不會受影響）。',
          () => {
            state.collections = state.collections.filter(it => it.id !== targetId);
            saveCollections();
            renderCollections();
            showToast('已刪除該筆收藏');
          }
        );
      });

      // 備份與還原視窗操作
      document.getElementById('btn-backup-menu').addEventListener('click', () => {
        document.getElementById('modal-backup').classList.remove('hidden');
      });
      document.getElementById('btn-close-backup').addEventListener('click', () => {
        document.getElementById('modal-backup').classList.add('hidden');
      });

      document.getElementById('btn-export-merch-json').addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(state.collections, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `妞妞周邊圖鑑備份_${getTodayISO()}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        document.getElementById('modal-backup').classList.add('hidden');
        showToast('圖鑑備份檔 (.json) 已下載！');
      });

      const importInput = document.getElementById('input-import-json');
      document.getElementById('btn-trigger-import-json').addEventListener('click', () => importInput.click());
      importInput.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            if (Array.isArray(parsed)) {
              state.collections = parsed;
              if (saveCollections()) {
                renderCollections();
                document.getElementById('modal-backup').classList.add('hidden');
                showToast(`成功還原 ${parsed.length} 筆周邊收藏！`);
              }
            } else {
              showToast('檔案格式不正確', 'error');
            }
          } catch (err) {
            showToast('讀取備份檔失敗', 'error');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      });

      // 通用確認彈窗按鈕
      document.getElementById('btn-confirm-cancel').addEventListener('click', () => {
        document.getElementById('modal-confirm').classList.add('hidden');
        confirmCallback = null;
      });
      document.getElementById('btn-confirm-ok').addEventListener('click', () => {
        document.getElementById('modal-confirm').classList.add('hidden');
        if (typeof confirmCallback === 'function') {
          confirmCallback();
          confirmCallback = null;
        }
      });
    }
  </script>
</body>
</html>
