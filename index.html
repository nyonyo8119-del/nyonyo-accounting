<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>妞妞記帳</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* iOS 滾動優化與隱藏捲軸 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    input[type="number"]::-webkit-inner-spin-button, 
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  </style>
</head>
<body class="bg-rose-50/40 text-slate-800 min-h-screen pb-20 font-sans antialiased selection:bg-rose-200">

  <!-- 頂部導覽列 -->
  <header class="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-rose-100 px-4 py-3 shadow-xs">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="text-2xl">🍰</span>
        <div>
          <h1 class="text-base font-bold text-slate-800 leading-none">妞妞記帳</h1>
          <p class="text-[11px] text-rose-400 font-medium mt-0.5" id="today-text"></p>
        </div>
      </div>
      <div class="flex items-center space-x-1">
        <button id="btn-export-csv" class="text-xs bg-rose-50 hover:bg-rose-100 text-rose-600 px-2.5 py-1.5 rounded-lg border border-rose-200 font-medium transition flex items-center gap-1">
          <i class="fa-solid fa-file-export"></i> 匯出
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-3 space-y-4">

    <!-- 信用卡結帳日倒數滑動卡片 -->
    <section>
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-xs font-semibold tracking-wider text-slate-500 uppercase flex items-center gap-1.5">
          <i class="fa-regular fa-credit-card text-rose-400"></i> 各卡結帳日倒數
        </h2>
        <span class="text-[11px] text-slate-400">左右滑動查看</span>
      </div>
      <div id="billing-cards" class="flex gap-2.5 overflow-x-auto no-scrollbar py-1">
        <!-- JS 自動生成各卡結帳日狀態 -->
      </div>
    </section>

    <!-- 記帳輸入卡片主體 -->
    <section class="bg-white rounded-2xl p-4 shadow-sm border border-rose-100 space-y-4">
      
      <!-- 交易日期與幣別 -->
      <div class="grid grid-cols-5 gap-2">
        <div class="col-span-3">
          <label class="block text-xs font-medium text-slate-500 mb-1">交易日期</label>
          <input type="date" id="input-date" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-700 font-medium focus:outline-none focus:border-rose-400 focus:bg-white transition" />
        </div>
        <div class="col-span-2">
          <label class="block text-xs font-medium text-slate-500 mb-1">幣別</label>
          <select id="input-currency" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 text-sm text-slate-700 font-semibold focus:outline-none focus:border-rose-400 focus:bg-white transition">
            <option value="TWD" selected>TWD (台幣)</option>
            <option value="KRW">KRW (韓元)</option>
            <option value="JPY">JPY (日圓)</option>
            <option value="USD">USD (美金)</option>
            <option value="EUR">EUR (歐元)</option>
            <option value="CNY">CNY (人民幣)</option>
            <option value="HKD">HKD (港幣)</option>
            <option value="GBP">GBP (英鎊)</option>
          </select>
        </div>
      </div>

      <!-- 總金額輸入 -->
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">支出金額</label>
        <div class="relative flex items-center">
          <span id="currency-symbol" class="absolute left-3.5 text-xl font-bold text-slate-400 font-mono">NT$</span>
          <input type="number" id="input-amount" placeholder="0" step="any" inputmode="decimal" class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-14 pr-4 py-2.5 text-2xl font-bold text-slate-800 placeholder-slate-300 focus:outline-none focus:border-rose-400 focus:bg-white transition" />
        </div>
      </div>

      <!-- 類別標籤快速切換 -->
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1.5">支出類別</label>
        <div id="category-grid" class="grid grid-cols-4 gap-1.5 text-xs font-medium">
          <!-- JS 產出類別按鈕 -->
        </div>
      </div>

      <!-- 付款方式分頁選擇器 -->
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">付款方式</label>
        
        <!-- 子分頁：現金點數 / 轉帳與支付 / 信用卡 -->
        <div class="flex bg-slate-100 p-0.5 rounded-lg text-xs font-medium mb-2" id="pay-type-tabs">
          <button type="button" data-type="credit" class="flex-1 py-1 rounded-md text-slate-800 bg-white shadow-xs font-semibold">信用卡</button>
          <button type="button" data-type="transfer" class="flex-1 py-1 rounded-md text-slate-500 hover:text-slate-800">轉帳/支付</button>
          <button type="button" data-type="cash" class="flex-1 py-1 rounded-md text-slate-500 hover:text-slate-800">現金/點數</button>
        </div>

        <!-- 付款方式下拉清單 -->
        <select id="input-payment" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-700 font-medium focus:outline-none focus:border-rose-400 focus:bg-white transition">
          <!-- JS 動態填入選項 -->
        </select>

        <!-- 帳單週期智慧推算提示 -->
        <div id="billing-cycle-hint" class="hidden mt-1.5 px-3 py-1.5 bg-amber-50 border border-amber-200/60 rounded-lg text-[11px] text-amber-700 flex items-center gap-1.5">
          <i class="fa-solid fa-calendar-check text-amber-500"></i>
          <span id="billing-cycle-text"></span>
        </div>
      </div>

      <!-- 拆帳區塊折疊切換 -->
      <div class="border-t border-slate-100 pt-3">
        <div class="flex items-center justify-between">
          <span class="text-xs font-semibold text-slate-700">是否拆帳</span>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="split-toggle" class="sr-only peer">
            <div class="w-9 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-rose-400"></div>
          </label>
        </div>

        <!-- 拆帳細節設定 (預設收合) -->
        <div id="split-detail" class="hidden mt-3 space-y-2.5 bg-rose-50/50 p-3 rounded-xl border border-rose-100">
          <div>
            <label class="block text-[11px] font-medium text-slate-500 mb-1">費用是誰出？</label>
            <div class="grid grid-cols-3 gap-1.5 text-xs font-medium" id="payer-buttons">
              <button type="button" data-payer="妞凱一起" class="py-1.5 rounded-lg border border-rose-300 bg-rose-400 text-white font-semibold shadow-xs">妞凱一起 (5:5)</button>
              <button type="button" data-payer="妞" class="py-1.5 rounded-lg border border-slate-200 bg-white text-slate-600">妞妞自付</button>
              <button type="button" data-payer="凱" class="py-1.5 rounded-lg border border-slate-200 bg-white text-slate-600">凱出</button>
            </div>
          </div>

          <div>
            <label class="block text-[11px] font-medium text-slate-500 mb-1">妞妞應付金額 (自動試算)</label>
            <div class="relative">
              <input type="number" id="split-actual-amount" step="any" placeholder="0" class="w-full bg-white border border-rose-200 rounded-lg px-3 py-1.5 text-sm font-bold text-rose-600 focus:outline-none focus:border-rose-400" />
            </div>
          </div>
        </div>
      </div>

      <!-- 備註與詳細資料 -->
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">備註 / 說明</label>
        <input type="text" id="input-note" placeholder="例如：好市多牛肉、星巴克拿鐵" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-700 placeholder-slate-400 focus:outline-none focus:border-rose-400 focus:bg-white transition" />
      </div>

      <!-- 送出記帳按鈕 -->
      <button type="button" id="btn-submit" class="w-full bg-rose-500 hover:bg-rose-600 active:scale-[0.99] text-white py-3 rounded-xl font-bold shadow-md shadow-rose-200 transition text-sm flex items-center justify-center gap-2">
        <i class="fa-solid fa-plus"></i> 新增這筆記帳
      </button>

    </section>

    <!-- 近期記帳紀錄 -->
    <section class="space-y-2">
      <div class="flex items-center justify-between">
        <h2 class="text-xs font-semibold tracking-wider text-slate-500 uppercase flex items-center gap-1.5">
          <i class="fa-solid fa-receipt text-rose-400"></i> 近期紀錄 (<span id="record-count">0</span>)
        </h2>
        <button id="btn-clear-all" class="text-[11px] text-slate-400 hover:text-rose-500 transition">清空資料</button>
      </div>

      <div id="records-list" class="space-y-2">
        <!-- 動態填入近期交易項目 -->
      </div>
    </section>

  </main>

  <script>
    // 1. 付款方式與結帳日設定（已加入 WOWPASS 與 Toss Pay）
    const PAYMENT_DATA = {
      credit: [
        { id: 'cathay_cube', name: '國泰 CUBE 卡', bank: '國泰', billingDay: 7 },
        { id: 'fubon_j', name: '富邦 J 卡', bank: '富邦', billingDay: 22 },
        { id: 'fubon_momo', name: '富邦 MOMO 卡', bank: '富邦', billingDay: 22 },
        { id: 'fubon_costco', name: '富邦 COSTCO 卡', bank: '富邦', billingDay: 22 },
        { id: 'taishin_richart', name: '台新 Richart 卡', bank: '台新', billingDay: 23 },
        { id: 'esun_nanshan', name: '玉山南山聯名卡', bank: '玉山', billingDay: 25 },
        { id: 'esun_ubear', name: '玉山 U BEAR 卡', bank: '玉山', billingDay: 25 },
        { id: 'sinopac_sport', name: '永豐 Sport 卡', bank: '永豐', billingDay: 26 },
        { id: 'sinopac_dawho', name: '永豐大戶卡', bank: '永豐', billingDay: 26 },
        { id: 'shanghai_simple', name: '上海簡單卡', bank: '上海', billingDay: 2 },
        { id: 'shanghai_minion', name: '上海小小兵卡', bank: '上海', billingDay: 2 },
        { id: 'ctbc_lalaport', name: '中信 LalaPort 卡', bank: '中信', billingDay: 27 },
        { id: 'ctbc_unipon', name: '中信 Unipon 卡', bank: '中信', billingDay: 27 }
      ],
      transfer: [
        { id: 'wowpass', name: 'WOWPASS' },
        { id: 'toss_pay', name: 'Toss Pay' },
        { id: 'line_pay_transfer', name: 'LINE 轉帳' },
        { id: 'bank_fubon', name: '銀行轉帳 - 富邦' },
        { id: 'bank_sinopac', name: '銀行轉帳 - 永豐' },
        { id: 'bank_next', name: '銀行轉帳 - 將來' }
      ],
      cash: [
        { id: 'cash', name: '現金' },
        { id: 'line_points', name: 'LINE POINT' }
      ]
    };

    // 2. 支出類別列表
    const CATEGORIES = [
      { id: 'food', name: '飲食餐飲', icon: 'utensils' },
      { id: 'grocery', name: '超市食材', icon: 'basket-shopping' },
      { id: 'daily', name: '日常居家', icon: 'house' },
      { id: 'transport', name: '交通加油', icon: 'bus' },
      { id: 'shopping', name: '購物治裝', icon: 'bag-shopping' },
      { id: 'entertainment', name: '休閒娛樂', icon: 'film' },
      { id: 'fixed', name: '固定帳單', icon: 'file-invoice-dollar' },
      { id: 'other', name: '其他支出', icon: 'ellipsis' }
    ];

    const CURRENCY_SYMBOLS = {
      TWD: 'NT$',
      KRW: '₩',
      JPY: '¥',
      USD: '$',
      EUR: '€',
      CNY: '¥',
      HKD: 'HK$',
      GBP: '£'
    };

    let state = {
      selectedCategory: CATEGORIES[0].name,
      currentPayType: 'credit',
      payer: '妞凱一起',
      records: JSON.parse(localStorage.getItem('nyonyo_accounting_records') || '[]')
    };

    // 初始化網頁元件
    document.addEventListener('DOMContentLoaded', () => {
      // 填入今日日期
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      document.getElementById('input-date').value = `${yyyy}-${mm}-${dd}`;
      document.getElementById('today-text').textContent = `${yyyy}/${mm}/${dd} 今日記帳`;

      renderBillingCards();
      renderCategoryGrid();
      populatePaymentOptions('credit');
      renderRecords();
      setupEventListeners();
    });

    // 渲染各信用卡結帳日倒數卡片
    function renderBillingCards() {
      const container = document.getElementById('billing-cards');
      container.innerHTML = '';
      const now = new Date();
      const todayDay = now.getDate();

      const banks = [
        { name: '上海', day: 2, cards: '簡單卡 / 小小兵' },
        { name: '國泰', day: 7, cards: 'CUBE 卡' },
        { name: '富邦', day: 22, cards: 'J卡/MOMO/Costco' },
        { name: '台新', day: 23, cards: 'Richart 卡' },
        { name: '玉山', day: 25, cards: '南山 / U BEAR' },
        { name: '永豐', day: 26, cards: 'Sport / 大戶' },
        { name: '中信', day: 27, cards: 'LalaPort/Unipon' }
      ];

      banks.forEach(b => {
        let diff = b.day - todayDay;
        let isPast = false;
        if (diff < 0) {
          const nextMonthDate = new Date(now.getFullYear(), now.getMonth() + 1, b.day);
          diff = Math.ceil((nextMonthDate - now) / (1000 * 60 * 60 * 24));
          isPast = true;
        }

        const isUrgent = diff <= 3;
        const cardEl = document.createElement('div');
        cardEl.className = `min-w-[130px] p-2.5 rounded-xl border flex flex-col justify-between shrink-0 shadow-2xs ${
          isUrgent ? 'bg-rose-50/90 border-rose-200 text-rose-900' : 'bg-white border-slate-200/70 text-slate-700'
        }`;
        
        cardEl.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="font-bold text-xs">${b.name} (${b.day}號)</span>
            <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded ${isUrgent ? 'bg-rose-200 text-rose-700' : 'bg-slate-100 text-slate-500'}">
              ${diff === 0 ? '今日結帳' : `剩 ${diff} 天`}
            </span>
          </div>
          <div class="text-[10px] text-slate-400 mt-1 truncate">${b.cards}</div>
        `;
        container.appendChild(cardEl);
      });
    }

    // 渲染分類按鈕
    function renderCategoryGrid() {
      const grid = document.getElementById('category-grid');
      grid.innerHTML = '';
      CATEGORIES.forEach(cat => {
        const btn = document.createElement('button');
        btn.type = 'button';
        const isSelected = state.selectedCategory === cat.name;
        btn.className = `py-2 px-1 rounded-xl flex flex-col items-center justify-center gap-1 transition ${
          isSelected 
            ? 'bg-rose-400 text-white font-semibold shadow-xs shadow-rose-200' 
            : 'bg-slate-50 text-slate-600 hover:bg-slate-100'
        }`;
        btn.innerHTML = `<i class="fa-solid fa-${cat.icon} text-sm"></i><span class="scale-90">${cat.name}</span>`;
        btn.onclick = () => {
          state.selectedCategory = cat.name;
          renderCategoryGrid();
        };
        grid.appendChild(btn);
      });
    }

    // 填入付款方式下拉清單
    function populatePaymentOptions(type) {
      const select = document.getElementById('input-payment');
      select.innerHTML = '';
      const list = PAYMENT_DATA[type] || [];
      list.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.name;
        opt.textContent = item.billingDay ? `${item.name} (${item.billingDay}日結帳)` : item.name;
        opt.dataset.billing = item.billingDay || '';
        select.appendChild(opt);
      });
      updateBillingCycleHint();
    }

    // 帳單週期試算提示
    function updateBillingCycleHint() {
      const select = document.getElementById('input-payment');
      const hintBox = document.getElementById('billing-cycle-hint');
      const hintText = document.getElementById('billing-cycle-text');
      const selectedOption = select.options[select.selectedIndex];
      const billingDay = selectedOption ? selectedOption.dataset.billing : null;
      const dateVal = document.getElementById('input-date').value;

      if (billingDay && dateVal) {
        const transDate = new Date(dateVal);
        const day = transDate.getDate();
        const month = transDate.getMonth() + 1;
        
        let cycleMonth;
        let cycleYear = transDate.getFullYear();
        if (day <= parseInt(billingDay, 10)) {
          cycleMonth = month;
        } else {
          cycleMonth = month + 1;
          if (cycleMonth > 12) {
            cycleMonth = 1;
            cycleYear += 1;
          }
        }
        hintText.textContent = `每月 ${billingDay} 日結帳：此筆計入 ${cycleYear} 年 ${cycleMonth} 月帳單`;
        hintBox.classList.remove('hidden');
      } else {
        hintBox.classList.add('hidden');
      }
    }

    // 自動試算拆帳
    function calculateSplitAmount() {
      const total = parseFloat(document.getElementById('input-amount').value) || 0;
      const actualInput = document.getElementById('split-actual-amount');
      if (state.payer === '妞凱一起') {
        actualInput.value = (total / 2).toFixed(total % 2 === 0 ? 0 : 1);
      } else if (state.payer === '妞') {
        actualInput.value = total;
      } else {
        actualInput.value = 0;
      }
    }

    // 綁定事件監聽器
    function setupEventListeners() {
      // 幣別切換
      const currencySelect = document.getElementById('input-currency');
      currencySelect.addEventListener('change', (e) => {
        const cur = e.target.value;
        document.getElementById('currency-symbol').textContent = CURRENCY_SYMBOLS[cur] || cur;
      });

      // 付款方式分頁按鈕切換
      const tabBtns = document.querySelectorAll('#pay-type-tabs button');
      tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          tabBtns.forEach(b => {
            b.className = 'flex-1 py-1 rounded-md text-slate-500 hover:text-slate-800';
          });
          btn.className = 'flex-1 py-1 rounded-md text-slate-800 bg-white shadow-xs font-semibold';
          state.currentPayType = btn.dataset.type;
          populatePaymentOptions(state.currentPayType);
        });
      });

      document.getElementById('input-payment').addEventListener('change', updateBillingCycleHint);
      document.getElementById('input-date').addEventListener('change', updateBillingCycleHint);

      // 拆帳開關切換
      const splitToggle = document.getElementById('split-toggle');
      const splitDetail = document.getElementById('split-detail');
      splitToggle.addEventListener('change', (e) => {
        if (e.target.checked) {
          splitDetail.classList.remove('hidden');
          calculateSplitAmount();
        } else {
          splitDetail.classList.add('hidden');
        }
      });

      // 拆帳付款人選擇
      const payerBtns = document.querySelectorAll('#payer-buttons button');
      payerBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          payerBtns.forEach(b => {
            b.className = 'py-1.5 rounded-lg border border-slate-200 bg-white text-slate-600';
          });
          btn.className = 'py-1.5 rounded-lg border border-rose-300 bg-rose-400 text-white font-semibold shadow-xs';
          state.payer = btn.dataset.payer;
          calculateSplitAmount();
        });
      });

      // 金額輸入聯動拆帳
      document.getElementById('input-amount').addEventListener('input', () => {
        if (splitToggle.checked) calculateSplitAmount();
      });

      // 新增記帳
      document.getElementById('btn-submit').addEventListener('click', () => {
        const amount = parseFloat(document.getElementById('input-amount').value);
        if (!amount || amount <= 0) {
          alert('請輸入有效的支出金額！');
          return;
        }

        const date = document.getElementById('input-date').value;
        const currency = document.getElementById('input-currency').value;
        const payment = document.getElementById('input-payment').value;
        const isSplit = document.getElementById('split-toggle').checked;
        const actualAmount = isSplit ? parseFloat(document.getElementById('split-actual-amount').value) || 0 : amount;
        const note = document.getElementById('input-note').value.trim();

        const newRecord = {
          id: Date.now(),
          date,
          currency,
          category: state.selectedCategory,
          amount,
          payment,
          isSplit,
          payer: isSplit ? state.payer : '本人',
          actualAmount,
          note
        };

        state.records.unshift(newRecord);
        localStorage.setItem('nyonyo_accounting_records', JSON.stringify(state.records));

        // 重設表單
        document.getElementById('input-amount').value = '';
        document.getElementById('input-note').value = '';
        renderRecords();
      });

      // 清空所有紀錄
      document.getElementById('btn-clear-all').addEventListener('click', () => {
        if (confirm('確定要清空所有已記錄的帳目嗎？（清空前可先匯出備份）')) {
          state.records = [];
          localStorage.removeItem('nyonyo_accounting_records');
          renderRecords();
        }
      });

      // 匯出 CSV
      document.getElementById('btn-export-csv').addEventListener('click', exportCSV);
    }

    // 渲染近期清單
    function renderRecords() {
      const container = document.getElementById('records-list');
      const countEl = document.getElementById('record-count');
      countEl.textContent = state.records.length;
      container.innerHTML = '';

      if (state.records.length === 0) {
        container.innerHTML = `
          <div class="text-center py-8 text-slate-400 text-xs bg-white rounded-xl border border-dashed border-slate-200">
            目前尚無記帳紀錄，點擊上方按鈕開始記帳吧！
          </div>
        `;
        return;
      }

      state.records.slice(0, 20).forEach(rec => {
        const item = document.createElement('div');
        item.className = 'bg-white p-3 rounded-xl border border-rose-50 shadow-2xs flex items-center justify-between text-xs';
        
        const symbol = CURRENCY_SYMBOLS[rec.currency] || rec.currency;
        item.innerHTML = `
          <div class="space-y-0.5">
            <div class="flex items-center gap-1.5">
              <span class="font-bold text-slate-800">${rec.category}</span>
              <span class="text-[10px] text-slate-400 font-mono">${rec.date}</span>
              <span class="text-[10px] bg-slate-100 text-slate-600 px-1 rounded">${rec.currency}</span>
              ${rec.isSplit ? `<span class="text-[10px] bg-rose-50 text-rose-500 font-medium px-1 rounded border border-rose-100">拆帳: ${rec.payer}</span>` : ''}
            </div>
            <div class="text-[11px] text-slate-400">
              ${rec.payment} ${rec.note ? `· ${rec.note}` : ''}
            </div>
          </div>
          <div class="text-right">
            <div class="font-bold text-sm text-slate-800">${symbol} ${rec.amount.toLocaleString()}</div>
            ${rec.isSplit ? `<div class="text-[10px] text-rose-400">妞付: ${symbol} ${rec.actualAmount.toLocaleString()}</div>` : ''}
          </div>
        `;
        container.appendChild(item);
      });
    }

    // 匯出 CSV 檔
    function exportCSV() {
      if (state.records.length === 0) {
        alert('目前沒有紀錄可以匯出！');
        return;
      }
      let csvContent = '\uFEFF交易日期,幣別,支出類別,總金額,付款方式,是否拆帳,費用誰出,妞實際付款金額,備註\n';
      state.records.forEach(r => {
        csvContent += `"${r.date}","${r.currency}","${r.category}",${r.amount},"${r.payment}","${r.isSplit ? '是' : '否'}","${r.payer}",${r.actualAmount},"${r.note || ''}"\n`;
      });
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', `妞妞記帳明細_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
